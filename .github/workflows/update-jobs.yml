name: Auto Update 104 Jobs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python fetch_104.py
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.json data/sync-status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update 104 jobs data" && git push)
