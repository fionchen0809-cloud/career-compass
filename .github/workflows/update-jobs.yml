name: Auto Update 104 Jobs

on:
  schedule:
    # 每天台灣時間早上 08:00 自動執行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊按鈕立即執行

permissions:
  contents: write # 允許機器人將更新後的 jobs.json 推回專案

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝 requests 套件
        run: pip install requests

      - name: 4. 執行爬蟲更新 jobs.json
        run: python fetch_104.py

      - name: 5. 自動 Commit 並 Push 回儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update 104 jobs data" && git push)
